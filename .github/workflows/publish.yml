name: Publish to npm

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in dry-run mode"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: npm publish --provenance --access public        